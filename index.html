<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Genesys Chat - Glassy Aquatic UI</title>

  <!-- Genesys Messenger Snippet -->
  <script type="text/javascript" charset="utf-8">
    (function (g, e, n, es, ys) {
      g["_genesysJs"] = e;
      g[e] = g[e] || function () {
        (g[e].q = g[e].q || []).push(arguments);
      };
      g[e].t = 1 * new Date();
      g[e].c = es;
      ys = document.createElement("script");
      ys.async = 1;
      ys.src = n;
      ys.charset = "utf-8";
      document.head.appendChild(ys);
    })(window, "Genesys", "https://apps.usw2.pure.cloud/genesys-bootstrap/genesys.min.js", {
      environment: "prod-usw2",
      deploymentId: "fbadeddd-a1ce-43d5-bc52-9798d1b72971"
    });
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a73e8, #5eb1ff);
    }

    #chat-wrapper {
      width: 350px;
      max-width: 90%;
      height: 600px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 15px;
      font-size: 18px;
    }

    #chat-header .title {
      margin: 0;
      font-weight: bold;
    }

    #chat-header .status {
      font-size: 14px;
      opacity: 0.9;
    }

    .status-online {
      color: #0f0;
      text-shadow: 0 0 6px #0f0;
    }

    .status-disconnected {
      color: #f44;
      text-shadow: 0 0 6px #f44;
    }

    .status-restored {
      color: #0f0;
      text-shadow: 0 0 6px #0f0;
    }

    .status-reconnecting {
      color: #ffd166;
      text-shadow: 0 0 6px #ffd166;
    }

    #chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background-color: rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      max-width: 80%;
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border-radius: 16px 16px 0 16px;
    }

    .message.received {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      border-radius: 16px 16px 16px 0;
    }

    .message.system {
      align-self: center;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      max-width: 90%;
    }

    .message p {
      margin: 10px;
      position: relative;
      word-break: break-word;
    }

    .message .timestamp {
      font-size: 10px;
      color: #eee;
      text-align: right;
      margin: 0 10px 5px;
    }

    .status-icon {
      float: right;
      margin-left: 8px;
      color: #fff;
      opacity: 0.8;
    }

    #typing-indicator {
      display: none;
      padding: 5px 15px;
      font-size: 12px;
      color: #fff;
      opacity: 0.9;
      font-style: italic;
    }

    #chat-input-container {
      display: flex;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    #message-input {
      flex: 1;
      border: none;
      padding: 15px;
      font-size: 16px;
      color: #fff;
      background: transparent;
    }

    #message-input::placeholder {
      color: #ddd;
    }

    #message-input:focus {
      outline: none;
    }

    #send-btn {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      color: #fff;
      padding: 0 20px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    #send-btn:hover {
      background: linear-gradient(135deg, #00b0e8, #0069e8);
    }

    .control-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .control-buttons button {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .control-buttons button:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .hover-glow:hover {
      box-shadow: 0 0 8px 2px rgba(255,255,255,0.5);
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="chat-wrapper">
    <div id="chat-header">
      <div class="title">Genesys Headless Messenger</div>
      <div class="status" id="chat-status">Offline</div>
    </div>

    <div id="chat-messages"></div>
    <div id="typing-indicator">Agent is typing...</div>

    <div id="chat-input-container">
      <input type="text" id="message-input" placeholder="Type your message here..." />
      <button id="send-btn">Send</button>
    </div>

    <div class="control-buttons">
      <button id="start-btn" class="hover-glow">Start Chat</button>
      <button id="disc-btn" class="hover-glow">Disconnect</button>
      <button id="clear-convo-btn" class="hover-glow">Clear Convo</button>
      <button id="del-btn" class="hover-glow">Clear Storage</button>
      <button id="fetch-btn" class="hover-glow">Fetch History</button>
      <button id="send-card-btn" class="hover-glow">Send Card</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
